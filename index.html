<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Play Chess</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #1e1b4b 0%, #4c1d95 50%, #7e22ce 100%);
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ÜST BAR */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; font-size: 20px;
  }
  .top-bar .back { color: #a78bfa; cursor: pointer; }
  .top-bar .logo { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 5px;}
  .top-bar .settings { color: #a78bfa; cursor: pointer; }

  /* KOÇ ALANI */
  .coach-area {
    display: flex; align-items: flex-end; padding: 10px 16px; gap: 10px;
    position: relative; z-index: 10; margin-bottom: -10px;
  }
  .avatar-container {
    position: relative; width: 70px; height: 70px;
  }
  .avatar-img {
    width: 100%; height: 100%; border-radius: 8px;
    background: url('https://api.dicebear.com/7.x/avataaars/svg?seed=Felix&clothing=graphicShirt&hair=short02&facialHair=beardMedium&skinColor=edb98a') no-repeat center;
    background-size: cover;
    border: 2px solid #a78bfa;
  }
  .avatar-level {
    position: absolute; bottom: -5px; left: -5px;
    background: #111; border: 1px solid #a78bfa;
    font-size: 11px; padding: 2px 6px; border-radius: 10px; font-weight: bold;
  }
  .speech-bubble {
    background: #fff; color: #000; padding: 12px 16px;
    border-radius: 12px; border-bottom-left-radius: 0;
    font-size: 15px; font-weight: 500; line-height: 1.3;
    flex: 1; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    min-height: 60px; display: flex; align-items: center;
  }

  /* TAHTA ALANI */
  .board-container {
    flex: 1; display: flex; justify-content: center; align-items: center;
    padding: 0 8px; width: 100%; max-width: 600px; margin: 0 auto;
  }
  #board {
    width: 100%; aspect-ratio: 1 / 1;
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    background-color: #f0d9b5;
  }
  .square { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .square.light { background-color: #EBE3D5; }
  .square.dark { background-color: #6B9EBF; } /* Fotoğraftaki turkuaz/mavi ton */

  /* Kare Vurguları */
  .square.last-move::before { content: ''; position: absolute; inset: 0; background: rgba(255, 255, 0, 0.35); }
  .square.selected::before { content: ''; position: absolute; inset: 0; background: rgba(255, 255, 0, 0.5); }
  .square.move-target::after {
    content: ''; position: absolute; width: 30%; height: 30%;
    border-radius: 50%; background: rgba(0,0,0,0.15);
  }
  .square.capture-target::after {
    content: ''; position: absolute; inset: 0;
    border: 6px solid rgba(0,0,0,0.15); border-radius: 50%;
  }

  /* TAŞLAR (Gerçek Resimler) */
  .piece {
    width: 90%; height: 90%;
    background-size: contain; background-repeat: no-repeat; background-position: center;
    position: relative; z-index: 2;
    transition: transform 0.1s;
  }
  /* Chess.com Benzeri 3D Taş Seti (Harici CDN) */
  .piece.w-p { background-image: url('https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg'); }
  .piece.w-n { background-image: url('https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg'); }
  .piece.w-b { background-image: url('https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg'); }
  .piece.w-r { background-image: url('https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg'); }
  .piece.w-q { background-image: url('https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg'); }
  .piece.w-k { background-image: url('https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'); }
  
  .piece.b-p { background-image: url('https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg'); }
  .piece.b-n { background-image: url('https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg'); }
  .piece.b-b { background-image: url('https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg'); }
  .piece.b-r { background-image: url('https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg'); }
  .piece.b-q { background-image: url('https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg'); }
  .piece.b-k { background-image: url('https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'); }

  /* Alt Bilgi (Puan vs) */
  .board-info {
    display: flex; justify-content: space-between; padding: 8px 20px;
    font-size: 14px; font-weight: 600; color: #c4b5fd;
  }

  /* HAMLE GEÇMİŞİ */
  .history-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 10px; font-size: 18px; font-weight: bold;
    background: rgba(0,0,0,0.2);
    margin: 0 16px; border-radius: 8px;
  }
  .history-bar .san { background: #fff; color: #000; padding: 4px 10px; border-radius: 4px;}
  .history-bar .arrow { color: #a78bfa; font-size: 24px; cursor: pointer; padding: 0 10px; }

  /* ALT MENÜ (Seçenekler, Terk Et vs) */
  .bottom-nav {
    display: flex; justify-content: space-around; align-items: center;
    padding: 15px 0 25px 0; background: transparent;
  }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    color: #c4b5fd; font-size: 12px; font-weight: 600; cursor: pointer;
    background: none; border: none; outline: none;
  }
  .nav-btn svg { width: 24px; height: 24px; fill: currentColor; }
  .nav-btn:active { transform: scale(0.95); }
  .nav-btn.active { color: #fff; }

  /* Modal / Seçenekler */
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    justify-content: center; align-items: center; z-index: 100; padding: 20px;
  }
  .modal-content {
    background: #2e1065; border: 1px solid #6d28d9; border-radius: 12px; padding: 20px;
    width: 100%; max-width: 300px; text-align: center;
  }
  .modal-content h3 { margin-bottom: 15px; color: #ddd6fe; }
  .diff-btn {
    display: block; width: 100%; padding: 12px; margin-bottom: 8px;
    background: #4c1d95; color: #fff; border: 1px solid #7e22ce; border-radius: 8px;
    font-size: 16px; font-weight: bold; cursor: pointer;
  }
  .diff-btn.active { background: #7e22ce; border-color: #c4b5fd; }
  .close-btn { margin-top: 10px; background: transparent; color: #a78bfa; border: none; font-size: 14px; cursor: pointer; }

</style>
</head>
<body>

<!-- ÜST BAR -->
<div class="top-bar">
  <div class="back">⬅</div>
  <div class="logo"><span style="color:#10b981; font-size:24px;">♟</span> Play Chess</div>
  <div class="settings">⚙️</div>
</div>

<!-- KOÇ -->
<div class="coach-area">
  <div class="avatar-container">
    <div class="avatar-img"></div>
    <div class="avatar-level">Bot</div>
  </div>
  <div class="speech-bubble" id="coachText">
    Hazır mısın? Hadi başlayalım!
  </div>
</div>

<!-- TAHTA -->
<div class="board-container">
  <div id="board"></div>
</div>

<!-- TAHTA ALT BİLGİ -->
<div class="board-info">
  <div id="scoreInfo">🤝 Beraberlik</div>
  <div id="turnInfo">Sıra: Beyaz</div>
</div>

<!-- HAMLE GEÇMİŞİ -->
<div class="history-bar">
  <div class="arrow" id="btnUndo">←</div>
  <div id="lastMoveDisplay"><span class="san">Başlangıç</span></div>
  <div class="arrow" style="opacity:0.3">→</div>
</div>

<!-- ALT MENÜ -->
<div class="bottom-nav">
  <button class="nav-btn" id="btnOptions">
    <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    Seçenekler
  </button>
  <button class="nav-btn" id="btnResign">
    <svg viewBox="0 0 24 24"><path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/></svg>
    Terk Et
  </button>
  <button class="nav-btn" id="btnHint">
    <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"/></svg>
    İpucu
  </button>
  <button class="nav-btn" id="btnNew">
    <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    Yeni Oyun
  </button>
</div>

<!-- SEÇENEKLER MODALI -->
<div class="modal" id="optionsModal">
  <div class="modal-content">
    <h3>Zorluk Seviyesi</h3>
    <button class="diff-btn" data-level="veryEasy">Çok Kolay</button>
    <button class="diff-btn" data-level="easy">Kolay</button>
    <button class="diff-btn active" data-level="medium">Orta</button>
    <button class="diff-btn" data-level="hard">Zor</button>
    <button class="diff-btn" data-level="veryHard">🔥 Çok Zor</button>
    <button class="close-btn" id="closeModal">Kapat</button>
  </div>
</div>

<script>
const FILES = ['a','b','c','d','e','f','g','h'];
let chess = new Chess();
let playerColor = 'w';
let difficulty = 'medium';
let selectedSq = null;
let legalTargets = [];
let lastMove = null;
let thinking = false;

const boardEl = document.getElementById('board');
const coachTextEl = document.getElementById('coachText');
const turnInfoEl = document.getElementById('turnInfo');
const lastMoveDisplay = document.getElementById('lastMoveDisplay');
const scoreInfo = document.getElementById('scoreInfo');

// Sesler
const moveSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_mp3_/default/move-self.mp3');
const captureSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_mp3_/default/capture.mp3');
const checkSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_mp3_/default/move-check.mp3');

const LEVELS = {
  veryEasy: { depth: 1, blunder: 0.40, margin: 400 },
  easy:     { depth: 1, blunder: 0.15, margin: 160 },
  medium:   { depth: 2, blunder: 0.05, margin: 60 },
  hard:     { depth: 3, blunder: 0.00, margin: 0 },
  veryHard: { depth: 4, blunder: 0.00, margin: 0 }
};

const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
const PST = {
  p: [0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
  n: [-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
  b: [-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
  r: [0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
  q: [-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
  k: [-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20]
};

function evaluate(g) {
  const board = g.board(); let score = 0;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = board[r][c]; if (!p) continue;
      const idx = (p.color === 'w') ? (r * 8 + c) : ((7 - r) * 8 + c);
      const v = PIECE_VALUES[p.type] + PST[p.type][idx];
      score += (p.color === 'w') ? v : -v;
    }
  }
  return score;
}

const MATE = 100000;
let nodes = 0, aborted = false, searchDeadline = 0;

function moveOrderScore(m) {
  let s = 0;
  if (m.captured) s += 10 * PIECE_VALUES[m.captured] - PIECE_VALUES[m.piece];
  if (m.promotion) s += PIECE_VALUES[m.promotion];
  if (m.san && m.san.includes('+')) s += 60;
  return s;
}

function negamax(g, depth, alpha, beta, ply) {
  if (aborted) return 0;
  nodes++;
  if ((nodes & 1023) === 0 && performance.now() > searchDeadline) { aborted = true; return 0; }
  if (depth <= 0) return g.turn() === 'w' ? evaluate(g) : -evaluate(g);
  
  const moves = g.moves({ verbose: true });
  if (moves.length === 0) return g.in_check() ? -(MATE - ply) : 0;
  moves.sort((a, b) => moveOrderScore(b) - moveOrderScore(a));

  let best = -Infinity;
  for (let i = 0; i < moves.length; i++) {
    g.move(moves[i]);
    const val = -negamax(g, depth - 1, -beta, -alpha, ply + 1);
    g.undo();
    if (aborted) return 0;
    if (val > best) best = val;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  return best;
}

function chooseAIMove() {
  const cfg = LEVELS[difficulty];
  const moves = chess.moves({ verbose: true });
  if (moves.length === 0) return null;
  if (cfg.blunder > 0 && Math.random() < cfg.blunder) return moves[(Math.random() * moves.length) | 0];

  searchDeadline = performance.now() + 2000;
  let bestMove = moves[0], scored = null;
  const ordered = moves.slice().sort((a, b) => moveOrderScore(b) - moveOrderScore(a));

  for (let d = 1; d <= cfg.depth; d++) {
    aborted = false; nodes = 0; const list = [];
    for (let i = 0; i < ordered.length; i++) {
      chess.move(ordered[i]);
      const val = -negamax(chess, d - 1, -Infinity, Infinity, 1);
      chess.undo();
      if (aborted) break;
      list.push({ m: ordered[i], val: val });
    }
    if (aborted) break;
    list.sort((a, b) => b.val - a.val);
    scored = list; bestMove = list[0].m;
  }
  if (scored && cfg.margin > 0) {
    const bestVal = scored[0].val;
    const pool = scored.filter(s => s.val >= bestVal - cfg.margin);
    if (pool.length > 0) return pool[(Math.random() * pool.length) | 0].m;
  }
  return bestMove;
}

/* TAHTA ÇİZİMİ */
function render() {
  boardEl.innerHTML = '';
  for (let i = 0; i < 64; i++) {
    const row = Math.floor(i / 8), col = i % 8;
    const rank = 7 - row;
    const file = col;
    const sqName = FILES[file] + (rank + 1);
    const isLight = ((file + rank) % 2) === 0;

    const sqEl = document.createElement('div');
    sqEl.className = 'square ' + (isLight ? 'light' : 'dark');
    
    if (lastMove && (lastMove.from === sqName || lastMove.to === sqName)) sqEl.classList.add('last-move');
    if (selectedSq === sqName) sqEl.classList.add('selected');
    if (legalTargets.includes(sqName)) {
      sqEl.classList.add(chess.get(sqName) ? 'capture-target' : 'move-target');
    }

    const piece = chess.get(sqName);
    if (piece) {
      const pEl = document.createElement('div');
      pEl.className = 'piece ' + piece.color + '-' + piece.type;
      sqEl.appendChild(pEl);
    }

    sqEl.addEventListener('click', () => onSquareClick(sqName));
    boardEl.appendChild(sqEl);
  }
}

function playSound(type) {
  try {
    if (type === 'move') { moveSound.currentTime = 0; moveSound.play(); }
    if (type === 'capture') { captureSound.currentTime = 0; captureSound.play(); }
    if (type === 'check') { checkSound.currentTime = 0; checkSound.play(); }
  } catch(e) {}
}

function onSquareClick(sq) {
  if (thinking || chess.game_over() || chess.turn() !== playerColor) return;

  if (selectedSq && legalTargets.includes(sq)) {
    const isCapture = !!chess.get(sq);
    const move = chess.move({ from: selectedSq, to: sq, promotion: 'q' });
    
    if (chess.in_check()) playSound('check');
    else if (isCapture) playSound('capture');
    else playSound('move');

    lastMove = move; selectedSq = null; legalTargets = [];
    render(); updateUI();

    if (checkGameEnd()) return;
    thinking = true;
    setTimeout(aiTurn, 100);
    return;
  }

  const piece = chess.get(sq);
  if (piece && piece.color === playerColor) {
    selectedSq = sq;
    legalTargets = chess.moves({ square: sq, verbose: true }).map(m => m.to);
  } else {
    selectedSq = null; legalTargets = [];
  }
  render();
}

function aiTurn() {
  if (chess.game_over()) { thinking = false; return; }
  const move = chooseAIMove();
  if (move) {
    const isCapture = !!chess.get(move.to);
    chess.move(move);
    lastMove = move;
    if (chess.in_check()) playSound('check');
    else if (isCapture) playSound('capture');
    else playSound('move');
  }
  thinking = false; selectedSq = null; legalTargets = [];
  render(); updateUI(); checkGameEnd();
}

/* ARAYÜZ GÜNCELLEMELERİ */
function updateUI() {
  turnInfoEl.textContent = 'Sıra: ' + (chess.turn() === 'w' ? 'Beyaz' : 'Siyah');
  
  const hist = chess.history({ verbose: true });
  if (hist.length === 0) {
    lastMoveDisplay.innerHTML = '<span class="san">Başlangıç</span>';
  } else {
    let html = '';
    let start = Math.max(0, hist.length - 2);
    for (let i = start; i < hist.length; i++) {
      if (i % 2 === 0) html += `<span style="color:#c4b5fd; margin-right:4px">${Math.floor(i/2)+1}.</span>`;
      html += `<span class="san" style="margin-right:4px">${hist[i].san}</span>`;
    }
    lastMoveDisplay.innerHTML = html;
  }

  // Puan durumu hesaplama (Chess.com tarzı)
  let score = evaluate(chess);
  if (score === 0) scoreInfo.textContent = '🤝 Eşit';
  else if (score > 0) scoreInfo.textContent = `👑 +${Math.round(score/100)}`;
  else scoreInfo.textContent = `👑 -${Math.round(Math.abs(score)/100)}`;

  updateCoach();
}

function updateCoach() {
  if (chess.game_over() || chess.turn() !== playerColor) return;
  const moves = chess.moves({ verbose: true });
  if (moves.length === 0) return;

  if (chess.in_check()) {
    coachTextEl.innerHTML = '<b>Şahın tehdit altında!</b> Şahı güvenli bir yere götür.';
    return;
  }

  // Basit bir rastgele tavsiye
  const tips = [
    'Merkezi kontrol etmeye çalış.',
    'At ve fillerini geliştir, şahını koru.',
    'Korumasız taş bırakmamaya dikkat et.',
    'Açık sütunlara kalelerini yerleştir.',
    'Taşların birbirini korusun.'
  ];
  coachTextEl.innerHTML = tips[Math.floor(Math.random() * tips.length)];
}

function checkGameEnd() {
  if (chess.in_checkmate()) {
    if (chess.turn() === playerColor) coachTextEl.innerHTML = '<b>Mat! Kaybettin.</b> Bir dahaki sefere daha iyi olacak.';
    else coachTextEl.innerHTML = '<b>Mat! Tebrikler, kazandın!</b> 🎉';
    return true;
  }
  if (chess.in_draw() || chess.in_stalemate() || chess.insufficient_material()) {
    coachTextEl.innerHTML = '<b>Oyun berabere bitti.</b>';
    return true;
  }
  return false;
}

/* BUTONLAR */
document.getElementById('btnNew').addEventListener('click', () => {
  chess = new Chess();
  lastMove = null; selectedSq = null; legalTargets = [];
  render(); updateUI();
  coachTextEl.innerHTML = 'Yeni oyun başladı. Hadi göster kendini!';
});

document.getElementById('btnUndo').addEventListener('click', () => {
  if (thinking || chess.history().length === 0) return;
  chess.undo(); if (chess.turn() !== playerColor && chess.history().length > 0) chess.undo();
  const h = chess.history({ verbose: true });
  lastMove = h.length > 0 ? h[h.length - 1] : null;
  selectedSq = null; legalTargets = [];
  render(); updateUI();
});

document.getElementById('btnHint').addEventListener('click', () => {
  if (thinking || chess.game_over() || chess.turn() !== playerColor) return;
  coachTextEl.innerHTML = 'İpucu düşünülüyor...';
  setTimeout(() => {
    const saved = difficulty; difficulty = 'hard';
    const best = chooseAIMove(); difficulty = saved;
    if (best) {
      coachTextEl.innerHTML = `Şu hamleyi dene: <b>${best.san}</b>`;
    }
  }, 50);
});

document.getElementById('btnResign').addEventListener('click', () => {
  if (chess.game_over()) return;
  chess.reset();
  coachTextEl.innerHTML = 'Oyundan çekildin. Yeni oyun için "Yeni Oyun"a bas.';
  render(); updateUI();
});

// Modal Kontrolleri
const modal = document.getElementById('optionsModal');
document.getElementById('btnOptions').addEventListener('click', () => modal.style.display = 'flex');
document.getElementById('closeModal').addEventListener('click', () => modal.style.display = 'none');

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    difficulty = e.target.dataset.level;
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    modal.style.display = 'none';
    coachTextEl.innerHTML = 'Zorluk seviyesi değiştirildi. Hazırsan başla!';
  });
});

// BAŞLAT
render(); updateUI();
</script>
</body>
  </html>
